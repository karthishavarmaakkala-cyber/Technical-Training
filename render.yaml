services:
  - type: web
    name: jobconnect-backend
    env: docker
    dockerContext: "backend jobconnect"
    dockerfilePath: "backend jobconnect/Dockerfile"
    plan: free
    envVars:
      - key: FRONTEND_ORIGIN
        value: https://jobconnect-frontend.onrender.com

  - type: web
    name: jobconnect-frontend
    env: docker
    dockerContext: "frontend jobconnect"
    dockerfilePath: "frontend jobconnect/Dockerfile"
    plan: free
